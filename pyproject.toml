[project]
name = "GPT2"
version = "0.1.0"
description = "A GPT2 based LLM experimentation bench."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "regex",
    "tqdm",
    "torch",
    "numpy",
    "matplotlib",
    "tokenizers",
    "torchtune",
    "torchao",
]

[dependency-groups]
dev = [
    "pytest",
    "flake8",
    "pytest-cov",
]
